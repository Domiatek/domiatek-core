name: Agent Task
description: Tarea a ejecutar por un agente de desarrollo
labels: ["agent-generated"]
body:
  - type: dropdown
    id: agent_type
    attributes:
      label: Tipo de Agente
      options: [mobile-dev, backend-dev, frontend-dev, devops-agent, qa-agent]
    validations:
      required: true
  - type: input
    id: roadmap_id
    attributes:
      label: Roadmap Item ID
      placeholder: "PA-001"
    validations:
      required: true
  - type: input
    id: target_repo
    attributes:
      label: Repositorio objetivo
      placeholder: "Domiatek/proges-app"
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Criterios de Aceptación
      placeholder: "- [ ] criterio 1\n- [ ] criterio 2"
    validations:
      required: true
  - type: textarea
    id: technical_context
    attributes:
      label: Contexto Técnico
      description: "Stack, patrones, convenciones a seguir"
