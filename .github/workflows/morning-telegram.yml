name: Morning Telegram

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Telegram and schedule item
        run: python3 scripts/morning_plan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Create daily issue
        run: python3 scripts/create_daily_issue.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit roadmap
        run: |
          git config user.name "Morning Router"
          git config user.email "router@domiatek.com"
          git add roadmap.json
          git diff --staged --quiet || git commit -m "chore: schedule top item $(date +%Y-%m-%d)" && git push
