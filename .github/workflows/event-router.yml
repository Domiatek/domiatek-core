name: Event Router — Agent Coordination

on:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, ready_for_review, closed]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      event_type:
        description: 'Evento a simular'
        required: true
        type: string

permissions:
  issues: write

jobs:
  route-event:
    runs-on: ubuntu-latest
    name: Route — ${{ github.event_name }}
    steps:
      - name: Determine routing
        id: route
        run: |
          case "${{ github.event_name }}/${{ github.event.action }}" in
            "issues/opened")       echo "agent=task-decomposer"; echo "action=validate-and-decompose" ;;
            "issues/closed")       echo "agent=learning-agent"; echo "action=record-completion" ;;
            "pull_request/opened"|"pull_request/ready_for_review")
                                   echo "agent=qa-agent"; echo "action=review-pr" ;;
            "pull_request/closed")
              if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                echo "agent=learning-agent"; echo "action=record-merge"
              fi ;;
            "check_run/completed")
              if [ "${{ github.event.check_run.conclusion }}" = "failure" ]; then
                echo "agent=dev-agent"; echo "action=fix-ci"
              fi ;;
          esac >> $GITHUB_OUTPUT

      - name: Create coordination event
        if: steps.route.outputs.agent != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          gh issue create \
            --repo Domiatek/domiatek-core \
            --title "[event] ${{ github.event_name }}/${{ steps.route.outputs.action }} → ${{ steps.route.outputs.agent }}" \
            --label "agent-event" \
            --body "## Routed Event
          **Event:** ${{ github.event_name }}
          **Agent:** ${{ steps.route.outputs.agent }}
          **Task:** ${{ steps.route.outputs.action }}
          **Source:** ${{ github.repository }}
          **Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>/dev/null || true
